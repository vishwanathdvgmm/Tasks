[project]
name = "task05-vector-database-engineering"
version = "0.1.0"
description = "Production-oriented pgvector and ChromaDB engineering lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "chromadb>=0.6.3",
  "numpy>=1.26.4",
  "pydantic-settings>=2.7.1",
  "rich>=13.9.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0", "ruff>=0.9.2"]

[project.scripts]
task05 = "task05_vector_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task05_vector_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
