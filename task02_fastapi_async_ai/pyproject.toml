[project]
name = "task02-fastapi-async-ai"
version = "1.0.0"
description = "High-throughput asynchronous AI API with FastAPI, SQLite, and SSE streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]