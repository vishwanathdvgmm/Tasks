services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task06
    ports:
      - "5433:5432"
    volumes:
      - task06_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task06"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  task06_pgdata:
