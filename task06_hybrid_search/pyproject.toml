[project]
name = "task06-hybrid-search"
version = "0.1.0"
description = "Hybrid retrieval with PostgreSQL full-text search, pgvector, RRF, and cross-encoder reranking"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "sentence-transformers>=3.3.1",
  "typer>=0.15.1",
  "rich>=13.9.4",
  "numpy>=1.26.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task06"]

[project.scripts]
task06 = "task06.cli:app"

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.9.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
