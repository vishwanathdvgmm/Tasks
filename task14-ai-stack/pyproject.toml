[project]
name = "task14-ai-stack"
version = "0.1.0"
description = "Containerized FastAPI AI service with PostgreSQL/pgvector, Redis, and Ollama"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.5,<3.0",
]

[tool.uv]
package = false
