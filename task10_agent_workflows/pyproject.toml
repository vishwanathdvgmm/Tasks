[project]
name = "task10-agent-workflows"
version = "0.1.0"
description = "Stateful multi-step AI agent workflow with reflection and human approval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
task10 = "task10_agent_workflows.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task10_agent_workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
