[project]
name = "task13-open-source-llm-serving"
version = "0.1.0"
description = "Local open-source LLM serving, VRAM estimation, and concurrency benchmarking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "typer>=0.12.0", "rich>=13.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.0"]

[project.scripts]
task13 = "task13.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task13"]
