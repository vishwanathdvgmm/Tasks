[project]
name = "task12-llm-observability"
version = "0.1.0"
description = "FastAPI LLM observability demo with tracing, token/cost accounting, latency metrics, and feedback"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0"
]
[project.optional-dependencies]
redis = ["redis>=5.0.0"]
langfuse = ["langfuse>=2.50.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
[project.scripts]
task12 = "task12_observability.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task12_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
