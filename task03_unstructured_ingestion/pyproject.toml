[project]
name = "task03-unstructured-ingestion"
version = "0.1.0"
description = "Multi-format document ingestion, cleaning, token-aware chunking, and benchmarking."
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.4.0"]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[project.scripts]
task03 = "task03_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task03_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
