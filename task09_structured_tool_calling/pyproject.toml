[project]
name = "task09-structured-tool-calling"
version = "0.1.0"
description = "Structured outputs and safe LLM tool-calling protocols"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
task09 = "task09.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task09"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
